<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCare - Login</title>

    <style>
        /* Reset default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page background styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main white login card */
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Main title */
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* Subtitle under title */
        .tagline {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        /* Wrapper for each input field */
        .form-group {
            margin-bottom: 20px;
        }

        /* Input labels */
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        /* Input field styling */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        /* Highlight input when focused */
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Login button styling */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        /* Button hover effect */
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Sign up link section */
        .toggle {
            text-align: center;
            margin-top: 20px;
        }

        .toggle a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .toggle a:hover {
            text-decoration: underline;
        }

        /* Footer styling */
        .footer {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .version {
            color: #aaa;
            font-size: 0.8em;
            margin-top: 10px;
        }

        /* Responsive adjustments for small screens */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- App title and tagline -->
        <div class="header">
            <h1>TCare</h1>
            <p class="tagline">Cognitive Games to Keep Your Brain Active</p>
        </div>

        <!-- Login form heading -->
        <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Login</h2>

        <!-- Email input -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- Password input -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <!-- Login button -->
        <button class="btn" id="loginBtn">Login</button>

        <!-- Sign up redirect -->
        <div class="toggle">
            <p>Don't have an account? <a href="signup.html">Sign Up</a>
        </div>

        <!-- Developer credits -->
        <div class="footer">
            <p>
                Developed by: Dantuluri, A. • Kang, P. • Kang, A. • Nguyen, K. • Rao, D. • Soman, A. • Tsai, A.
            </p>
            <p class="version">Version 0.1 - Initial Release</p>
        </div>
    </div>

    <!-- Firebase Authentication Script -->
    <script type="module">
        import { auth } from "./firebase.js";
        import {
          signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      
        // Get button and link elements
        const loginBtn = document.getElementById("loginBtn");
        const signupLink = document.getElementById("signupLink");
      
        // Login button click handler
        loginBtn.addEventListener("click", async () => {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
      
          // Basic validation
          if (!email || !password) {
            alert("Please enter email and password");
            return;
          }
      
          try {
            // Attempt Firebase sign-in
            await signInWithEmailAndPassword(auth, email, password);

            // Redirect to home page after successful login
            window.location.href = "homeuser.html";
          } catch (error) {
            // Show error message if login fails
            alert(error.message);
          }
        });
      
        // Temporary signup link handler (if implemented later)
        signupLink.addEventListener("click", () => {
          alert("Sign up page coming soon 🙂");
        });
    </script>
</body>
</html>
