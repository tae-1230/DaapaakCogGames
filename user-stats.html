<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TCare – User Statistics</title>

  <style>
    /* Reset default spacing */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Page background styling */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Main white card container */
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    /* Page heading */
    h1 { font-size: 2.5em; color: #333; }

    /* Subtitle */
    .tagline { color: #666; margin-bottom: 20px; }

    /* Back button */
    .back-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      float: right;
    }

    /* User info box */
    .user-info {
      background: #f0f4ff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    /* Top stats summary grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    /* Individual summary stat card */
    .stat-card {
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-value { font-size: 3em; font-weight: bold; }

    /* Section title */
    .section-title {
      font-size: 1.8em;
      margin: 30px 0 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    /* Individual game stat item */
    .game-stat-item {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    /* Metrics container */
    .game-metrics {
      display: flex;
      gap: 20px;
    }

    /* Metric value styling */
    .metric-value {
      color: #667eea;
      font-weight: bold;
      font-size: 1.3em;
      text-align: center;
    }

    /* Metric label styling */
    .metric-label {
      text-align: center;
      font-size: .9em;
      color: #666;
    }

    /* Footer */
    footer {
      margin-top: 30px;
      text-align: center;
      color: #999;
      font-size: .9em;
    }
  </style>

  <!-- ================= AUTH GUARD ================= -->
  <!-- Redirects to login if user is not authenticated -->
  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged } from
      "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        // Display logged-in user's email
        document.getElementById("userEmail").textContent = user.email;
      }
    });
  </script>
</head>

<body>
<div class="container">

  <!-- Back button to home -->
  <button class="back-btn" onclick="location.href='homeuser.html'">← Back</button>

  <!-- Page title -->
  <h1>📊 Your Statistics</h1>
  <p class="tagline">Track your cognitive performance</p>

  <!-- User email display -->
  <div class="user-info">
    <p>Email: <strong id="userEmail">Loading…</strong></p>
  </div>

  <!-- Summary statistics -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="totalGames">0</div>
      Games Played
    </div>
    <div class="stat-card">
      <div class="stat-value" id="avgScore">0</div>
      Average Score
    </div>
    <div class="stat-card">
      <div class="stat-value" id="bestStreak">0</div>
      Best Streak
    </div>
  </div>

  <!-- Per-game breakdown section -->
  <h2 class="section-title">Game Performance</h2>
  <div id="games"></div>

  <!-- Footer -->
  <footer>
    Developed by Dantuluri, A. • Kang, P. • Kang, A. • Nguyen, K. • Rao, D. • Soman, A. • Tsai, A.
    <div>Version 0.1</div>
  </footer>

</div>

<!-- ================= STATS LOGIC ================= -->
<script type="module">

/* ===== IMPORTS ===== */
import { auth, db } from "./firebase.js";
import { collection, getDocs } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== GAMES CONFIGURATION ===== */
/* Defines each game, its Firestore key, metric extraction logic, and unit */
const GAMES = [
  {
    name: "Recall Trail",
    key: "trail_making_popup_recall",
    metric: s => s.metrics?.completion_time_s,
    unit: "s"
  },
  {
    name: "Reaction Time Test",
    key: "visual_reaction_time",
    metric: s => s.metrics?.mean_rt_ms,
    unit: "ms"
  },
  {
    name: "What is Missing?",
    key: "whats_missing",
    metric: s => s.final_score,
    unit: ""
  },
  {
    name: "Sudoku",
    key: "sudoku",
    metric: s => s.time_seconds,
    unit: "s"
  },
  {
    name: "Flow Free",
    key: "flow_free",
    metric: s => s.metrics?.completion_time_s,
    unit: "s"
  }
];

/* ===== HELPER FUNCTION ===== */
/* Loads all sessions for a specific user and game */
async function loadGame(uid, gameKey) {
  const snap = await getDocs(
    collection(db, "users", uid, "games", gameKey, "sessions")
  );
  return snap.docs.map(d => d.data());
}

/* ===== MAIN STATS FUNCTION ===== */
async function loadStats(uid) {
  let totalGames = 0;
  let streak = 0;
  let scorePool = [];

  const container = document.getElementById("games");
  container.innerHTML = "";

  // Loop through each configured game
  for (const game of GAMES) {
    const sessions = await loadGame(uid, game.key);

    totalGames += sessions.length;
    streak = Math.max(streak, sessions.length);

    // Extract metric values
    const values = sessions.map(game.metric).filter(Number);

    // Collect scores for average score calculation
    if (game.unit === "") scorePool.push(...values);

    // Render game stat card dynamically
    container.innerHTML += `
      <div class="game-stat-item">
        <strong>${game.name}</strong>
        <div class="game-metrics">
          <div>
            <div class="metric-value">${sessions.length}</div>
            <div class="metric-label">Played</div>
          </div>
          <div>
            <div class="metric-value">${
              values.length
                ? (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1) + game.unit
                : "-"
            }</div>
            <div class="metric-label">Average</div>
          </div>
          <div>
            <div class="metric-value">${
              values.length ? Math.min(...values) + game.unit : "-"
            }</div>
            <div class="metric-label">Best</div>
          </div>
        </div>
      </div>
    `;
  }

  // Update summary statistics
  document.getElementById("totalGames").textContent = totalGames;
  document.getElementById("bestStreak").textContent = streak;

  document.getElementById("avgScore").textContent =
    scorePool.length
      ? Math.round(scorePool.reduce((a,b)=>a+b,0) / scorePool.length)
      : 0;
}

/* ===== AUTH LISTENER ===== */
/* Load stats once user is authenticated */
auth.onAuthStateChanged(user => {
  if (user) loadStats(user.uid);
});
</script>

</body>
</html>
